---
# Run against all servers:  ansible-playbook playbooks/update.yml
# Run against one group:    ansible-playbook playbooks/update.yml --limit remote
# Auto-reboot if needed:    ansible-playbook playbooks/update.yml -e auto_reboot=true

- name: OS update and restart detection
  hosts: managed
  become: true
  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
      register: apt_upgrade

    - name: Install needrestart
      ansible.builtin.apt:
        name: needrestart
        state: present

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Check which services need restarting
      ansible.builtin.command: needrestart -b -q
      register: needrestart_out
      changed_when: false
      failed_when: false

    - name: Show packages that were upgraded
      ansible.builtin.debug:
        msg: "{{ apt_upgrade.stdout_lines }}"
      when: apt_upgrade.changed

    - name: Show services that need restarting
      ansible.builtin.debug:
        msg: "{{ needrestart_out.stdout_lines }}"
      when: needrestart_out.stdout_lines | length > 0

    - name: Notify reboot required
      ansible.builtin.debug:
        msg: "REBOOT REQUIRED on {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    - name: Reboot if required and auto_reboot is enabled
      ansible.builtin.reboot:
        msg: "Rebooting after OS update"
        reboot_timeout: 300
      when: reboot_required.stat.exists and auto_reboot | bool
