server {
    listen 443 ssl;
    include /config/nginx/ssl.conf;
    server_name financial.sudoservers.com;

    # Compiled frontend static files
    root /config/www/financial-dashboard;
    index index.html;

    # React client-side routing — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://financial-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
