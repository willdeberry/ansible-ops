---
- name: Ensure docker projects directory exists
  ansible.builtin.file:
    path: /home/will/docker/projects
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Clone or update financial-dashboard repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/financial-dashboard.git
    dest: /home/will/docker/projects/financial-dashboard
    update: true
    accept_hostkey: true
  become_user: will
  register: financial_repo
  tags: [financial-dashboard]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Deploy financial.sudoservers.com nginx conf
  ansible.builtin.copy:
    src: financial.sudoservers.com.conf
    dest: /home/will/docker/homelab/nginx/config/site-confs/financial.sudoservers.com.conf
    owner: will
    group: will
    mode: "0644"
  notify: Restart nginx container (financial-dashboard)
  tags: [financial-dashboard]

- name: Rebuild and restart financial-dashboard containers
  ansible.builtin.command:
    cmd: docker compose up --build -d
    chdir: /home/will/docker/projects/financial-dashboard
  become_user: will
  when: financial_repo.changed or financial_force_build | default(false) | bool
  tags: [financial-dashboard]
