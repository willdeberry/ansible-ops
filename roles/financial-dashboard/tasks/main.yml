---
- name: Ensure repos staging directory exists
  ansible.builtin.file:
    path: /home/will/repos
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Clone or update financial-dashboard repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/financial-dashboard.git
    dest: /home/will/repos/financial-dashboard
    update: true
    accept_hostkey: true
  become_user: will
  register: financial_repo
  tags: [financial-dashboard]

- name: Check if node_modules exists
  ansible.builtin.stat:
    path: /home/will/repos/financial-dashboard/frontend/node_modules
  register: financial_node_modules
  tags: [financial-dashboard]

- name: Install npm dependencies
  ansible.builtin.command:
    cmd: npm install
    chdir: /home/will/repos/financial-dashboard/frontend
  become_user: will
  when: financial_repo.changed or not financial_node_modules.stat.exists
  tags: [financial-dashboard]

- name: Build financial-dashboard frontend
  ansible.builtin.command:
    cmd: npm run build
    chdir: /home/will/repos/financial-dashboard/frontend
  environment:
    VITE_API_URL: /api
  become_user: will
  register: financial_build
  when: financial_repo.changed or not financial_node_modules.stat.exists or financial_force_build | default(false) | bool
  tags: [financial-dashboard]

- name: Ensure financial-dashboard nginx www directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/www/financial-dashboard
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Sync dist/ into nginx www dir
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      /home/will/repos/financial-dashboard/frontend/dist/
      /home/will/docker/homelab/nginx/www/financial-dashboard/
  become_user: will
  tags: [financial-dashboard]

- name: Ensure financial-dashboard backend directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/financial-dashboard/backend
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Sync backend/app/ into financial-dashboard dir
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      --include='app/***' --include='requirements.txt' --exclude='*'
      /home/will/repos/financial-dashboard/backend/
      /home/will/docker/homelab/financial-dashboard/backend/
  tags: [financial-dashboard]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [financial-dashboard]

- name: Deploy financial.sudoservers.com nginx conf
  ansible.builtin.copy:
    src: financial.sudoservers.com.conf
    dest: /home/will/docker/homelab/nginx/config/site-confs/financial.sudoservers.com.conf
    owner: will
    group: will
    mode: "0644"
  notify: Restart nginx container
  tags: [financial-dashboard]
