---
- name: Ensure docker projects directory exists
  ansible.builtin.file:
    path: /home/will/docker/projects
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-tree]

- name: Clone or update family-tree repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/family.sudoservers.com.git
    dest: /home/will/docker/projects/family-tree
    update: true
    accept_hostkey: true
  become_user: will
  register: family_repo
  tags: [family-tree]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/conf/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-tree]

- name: Deploy family.sudoservers.com nginx conf
  ansible.builtin.copy:
    src: /home/will/docker/projects/family-tree/deploy/family.sudoservers.com.conf
    dest: /home/will/docker/homelab/nginx/conf/site-confs/family.sudoservers.com.conf
    remote_src: true
    owner: will
    group: will
    mode: "0644"
  notify: Restart nginx container (family-tree)
  tags: [family-tree]

- name: Rebuild and restart family-tree containers
  ansible.builtin.command:
    cmd: docker compose up --build -d
    chdir: /home/will/docker/projects/family-tree
  become_user: will
  when: family_repo.changed or family_force_build | default(false) | bool
  tags: [family-tree]
