---
- name: Ensure /etc/family-sudoservers directory exists
  ansible.builtin.file:
    path: /etc/family-sudoservers
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [family-sudoservers]

- name: Ensure repos staging directory exists
  ansible.builtin.file:
    path: /home/will/repos
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-sudoservers]

- name: Clone or update family.sudoservers.com repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/family.sudoservers.com.git
    dest: /home/will/repos/family.sudoservers.com
    update: true
    accept_hostkey: true
  become_user: will
  register: family_repo
  tags: [family-sudoservers]

- name: Check if node_modules exists
  ansible.builtin.stat:
    path: /home/will/repos/family.sudoservers.com/web/node_modules
  register: family_node_modules
  tags: [family-sudoservers]

- name: Install npm dependencies
  ansible.builtin.command:
    cmd: npm ci
    chdir: /home/will/repos/family.sudoservers.com/web
  become_user: will
  when: family_repo.changed or not family_node_modules.stat.exists
  tags: [family-sudoservers]

- name: Build family.sudoservers.com web
  ansible.builtin.command:
    cmd: npm run build
    chdir: /home/will/repos/family.sudoservers.com/web
  environment:
    PUBLIC_GOOGLE_CLIENT_ID: 737811340148-ht784t8ukngtoaav6hrte0mlen8tk5ln.apps.googleusercontent.com
  become_user: will
  register: family_build
  when: family_repo.changed or not family_node_modules.stat.exists
  tags: [family-sudoservers]

- name: Ensure family-sudoservers client directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/www/family.sudoservers.com/client
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-sudoservers]

- name: Ensure family-sudoservers server directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/www/family.sudoservers.com/server
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-sudoservers]

- name: Sync web/dist/client into nginx www client dir
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      /home/will/repos/family.sudoservers.com/web/dist/client/
      /home/will/docker/homelab/nginx/www/family.sudoservers.com/client/
  become_user: will
  when: family_build.changed
  tags: [family-sudoservers]

- name: Sync web/dist/server into nginx www server dir
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      /home/will/repos/family.sudoservers.com/web/dist/server/
      /home/will/docker/homelab/nginx/www/family.sudoservers.com/server/
  become_user: will
  when: family_build.changed
  tags: [family-sudoservers]

- name: Sync web/node_modules into nginx www dir
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      /home/will/repos/family.sudoservers.com/web/node_modules/
      /home/will/docker/homelab/nginx/www/family.sudoservers.com/node_modules/
  become_user: will
  when: family_build.changed
  tags: [family-sudoservers]

- name: Sync web/package.json into nginx www dir
  ansible.builtin.copy:
    src: /home/will/repos/family.sudoservers.com/web/package.json
    dest: /home/will/docker/homelab/nginx/www/family.sudoservers.com/package.json
    remote_src: true
    owner: will
    group: will
    mode: "0644"
  when: family_build.changed
  tags: [family-sudoservers]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [family-sudoservers]

- name: Deploy family.sudoservers.com nginx conf
  ansible.builtin.copy:
    src: /home/will/repos/family.sudoservers.com/deploy/family.sudoservers.com.conf
    dest: /home/will/docker/homelab/nginx/config/site-confs/family.sudoservers.com.conf
    remote_src: true
    owner: will
    group: will
    mode: "0644"
  notify: Restart nginx container
  tags: [family-sudoservers]
