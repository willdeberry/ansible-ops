---
- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-buildx
      - docker-compose-v2
    state: present
    update_cache: true
  notify: Restart docker

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure Docker service is in desired state
  ansible.builtin.service:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"

- name: Ensure managed directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: will
    group: will
    mode: "0755"
  loop: "{{ docker_managed_dirs }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.link | length == 0

- name: Ensure symlink targets exist
  ansible.builtin.file:
    path: "{{ item.link }}"
    state: directory
    owner: will
    group: will
    mode: "0755"
  loop: "{{ docker_managed_dirs }}"
  loop_control:
    label: "{{ item.link }}"
  when: item.link | length > 0

- name: Ensure symlinks are in place
  ansible.builtin.file:
    src:  "{{ item.link }}"
    dest: "{{ item.path }}"
    state: link
    owner: will
    group: will
  loop: "{{ docker_managed_dirs }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.link | length > 0

- name: Add extra users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
