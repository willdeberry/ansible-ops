---
- name: Ensure user accounts exist
  ansible.builtin.user:
    name:        "{{ item.username }}"
    comment:     "{{ item.comment     | default(item.username) }}"
    shell:       "{{ item.shell       | default('/bin/bash') }}"
    groups:      "{{ item.groups      | default([]) | join(',') }}"
    append:      true
    home:        "{{ item.home        | default('/home/' + item.username) }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: present
  loop: "{{ all_managed_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Set home directory permissions
  ansible.builtin.file:
    path:  "{{ item.home | default('/home/' + item.username) }}"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode:  "{{ item.home_mode | default('0750') }}"
  loop: "{{ all_managed_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Install SSH authorized keys
  ansible.posix.authorized_key:
    user:      "{{ item.username }}"
    key:       "{{ all_ssh_keys[item.username] }}"
    state:     present
    exclusive: true
  loop: "{{ all_managed_users }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.username in all_ssh_keys
