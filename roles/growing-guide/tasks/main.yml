---
- name: Ensure growing-guide www directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/www/growing-guide
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [growing-guide]

- name: Deploy growing-guide index.html
  ansible.builtin.copy:
    src: index.html
    dest: /home/will/docker/homelab/nginx/www/growing-guide/index.html
    owner: will
    group: will
    mode: "0644"
  tags: [growing-guide]

- name: Deploy growing-guide grass.html
  ansible.builtin.copy:
    src: grass.html
    dest: /home/will/docker/homelab/nginx/www/growing-guide/grass.html
    owner: will
    group: will
    mode: "0644"
  tags: [growing-guide]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/homelab/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [growing-guide]

- name: Deploy growing-guide nginx config
  ansible.builtin.copy:
    src: growing-guide.conf
    dest: /home/will/docker/homelab/nginx/config/site-confs/growing-guide.conf
    owner: will
    group: will
    mode: "0644"
  notify: Restart nginx container
  tags: [growing-guide]
