---
- name: Download and dearmor NodeSource GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    creates: /etc/apt/keyrings/nodesource.gpg
  tags: [oicoruja]

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main"
    state: present
    filename: nodesource
  tags: [oicoruja]

- name: Check nodejs version
  ansible.builtin.command: node --version
  register: node_version
  changed_when: false
  failed_when: false
  tags: [oicoruja]

- name: Remove old nodejs
  ansible.builtin.apt:
    name: nodejs
    state: absent
  when: node_version.rc != 0 or not node_version.stdout.startswith('v22')
  tags: [oicoruja]

- name: Install nodejs 22 from NodeSource
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  when: node_version.rc != 0 or not node_version.stdout.startswith('v22')
  tags: [oicoruja]

- name: Ensure www directory exists
  ansible.builtin.file:
    path: /home/will/docker/oicoruja/nginx/www
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [oicoruja]

- name: Clone or update oicoruja repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/oicoruja.com.br.git
    dest: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
    update: true
    accept_hostkey: true
  become_user: will
  register: oicoruja_repo
  tags: [oicoruja]

- name: Check if node_modules exists
  ansible.builtin.stat:
    path: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br/node_modules
  register: node_modules_stat
  tags: [oicoruja]

- name: Install npm dependencies
  ansible.builtin.command:
    cmd: npm ci
    chdir: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
  become_user: will
  when: oicoruja_repo.changed or not node_modules_stat.stat.exists
  tags: [oicoruja]

- name: Build oicoruja
  ansible.builtin.command:
    cmd: npm run build
    chdir: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
  become_user: will
  when: oicoruja_repo.changed or not node_modules_stat.stat.exists
  notify: Restart nginx container
  tags: [oicoruja]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/oicoruja/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [oicoruja]

- name: Symlink nginx.conf from repo to site-confs
  ansible.builtin.file:
    src: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br/nginx.conf
    dest: /home/will/docker/oicoruja/nginx/config/site-confs/oicoruja.conf
    state: link
    owner: will
    group: will
  tags: [oicoruja]
