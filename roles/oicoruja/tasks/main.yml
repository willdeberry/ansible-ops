---
- name: Ensure www directory exists
  ansible.builtin.file:
    path: /home/will/docker/oicoruja/nginx/www
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [oicoruja]

- name: Clone or update oicoruja repo
  ansible.builtin.git:
    repo: git@github.com:willdeberry/oicoruja.com.br.git
    dest: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
    update: true
    accept_hostkey: true
  become_user: will
  register: oicoruja_repo
  tags: [oicoruja]

- name: Check if node_modules exists
  ansible.builtin.stat:
    path: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br/node_modules
  register: node_modules_stat
  tags: [oicoruja]

- name: Deploy .env.production
  ansible.builtin.copy:
    content: "{{ vault_oicoruja_env_production }}"
    dest: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br/.env.production
    owner: will
    group: will
    mode: "0600"
  register: oicoruja_env
  tags: [oicoruja]

- name: Install npm dependencies
  ansible.builtin.command:
    cmd: npm ci
    chdir: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
  become_user: will
  when: oicoruja_repo.changed or not node_modules_stat.stat.exists
  tags: [oicoruja]

- name: Build oicoruja
  ansible.builtin.command:
    cmd: npm run build
    chdir: /home/will/docker/oicoruja/nginx/www/oicoruja.com.br
  become_user: will
  when: oicoruja_repo.changed or not node_modules_stat.stat.exists or oicoruja_env.changed
  notify: Restart nginx container
  tags: [oicoruja]

- name: Ensure nginx site-confs directory exists
  ansible.builtin.file:
    path: /home/will/docker/oicoruja/nginx/config/site-confs
    state: directory
    owner: will
    group: will
    mode: "0755"
  tags: [oicoruja]

- name: Symlink nginx.conf from repo to site-confs
  ansible.builtin.file:
    src: /config/www/oicoruja.com.br/nginx.conf
    dest: /home/will/docker/oicoruja/nginx/config/site-confs/oicoruja.conf
    state: link
    owner: will
    group: will
    force: true
    follow: false
  tags: [oicoruja]
